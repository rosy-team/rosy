[package]
name = "rosy-cli"
version = "1.11.0"
edition = "2024"
authors = ["hiibolt <rust@hiibolt.com>"]
license = "MIT"
description = "Rosy CLI: transpile and run Rosy programs"
repository = "https://github.com/rosy-team/rosy"
homepage = "https://github.com/rosy-team/rosy"
documentation = "https://docs.rs/rosy-cli"

[[bin]]
name = "rosy"
path = "src/main.rs"

[features]
nightly-simd = ["rosy-compiler/nightly-simd"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
rosy-compiler = { version = "1.11.0", path = "../rosy-compiler" }
tokio = { version = "1", features = ["rt", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"
