[package]
name = "rosy-lib"
version = "1.10.1"
edition = "2024"
authors = ["hiibolt <rust@hiibolt.com>"]
license = "MIT"
description = "Rosy runtime library: types, operators, DA/CD, and intrinsics"
repository = "https://github.com/rosy-team/rosy"
homepage = "https://github.com/rosy-team/rosy"
documentation = "https://docs.rs/rosy-lib"

[features]
mpi = ["dep:mpi", "dep:bincode"]
nightly-simd = []

[dependencies]
anyhow = "1.0"
mpi = { version = "0.8", optional = true }
bincode = { version = "2.0", optional = true }
num-complex = "0.4"
rustc-hash = "2"
rand = "0.9"
libm = "0.2"
memory-stats = "1"
libc = "0.2"

[dev-dependencies]
serial_test = "3.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("mpi", "nightly-simd"))'] }
