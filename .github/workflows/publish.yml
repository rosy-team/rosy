name: Publish

on:
  push:
    branches: [master]
    paths:
      - 'rosy-lib/Cargo.toml'
      - 'rosy-compiler/Cargo.toml'
      - 'rosy-cli/Cargo.toml'

permissions:
  contents: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      lib_version: ${{ steps.version.outputs.lib_version }}
      compiler_version: ${{ steps.version.outputs.compiler_version }}
      cli_version: ${{ steps.version.outputs.cli_version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_new: ${{ steps.tag.outputs.is_new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract versions
        id: version
        run: |
          LIB=$(grep '^version' rosy-lib/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMPILER=$(grep '^version' rosy-compiler/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CLI=$(grep '^version' rosy-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "lib_version=$LIB" >> "$GITHUB_OUTPUT"
          echo "compiler_version=$COMPILER" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLI" >> "$GITHUB_OUTPUT"

      - name: Check if git tag exists
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.cli_version }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.version.outputs.cli_version }} already exists"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  publish-crates:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          LIB_VERSION: ${{ needs.check-version.outputs.lib_version }}
          COMPILER_VERSION: ${{ needs.check-version.outputs.compiler_version }}
          CLI_VERSION: ${{ needs.check-version.outputs.cli_version }}
        run: |
          set -euo pipefail
          UA="rosy-ci (github.com/rosy-team/rosy)"

          crate_exists() {
            local name="$1" version="$2"
            local url="https://crates.io/api/v1/crates/${name}/${version}"
            curl -fsS -o /dev/null -A "$UA" "$url"
          }

          sparse_index_url() {
            local name="$1"
            # crates.io sparse index: first two chars of the crate name
            echo "https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          }

          wait_for_index() {
            local name="$1" version="$2"
            local url
            url="$(sparse_index_url "$name")"
            echo "Waiting for $name $version on the crates.io sparse index"
            for i in $(seq 1 40); do
              if curl -fsS -A "$UA" "$url" | grep -q "\"vers\":\"${version}\""; then
                echo "$name $version is on the sparse index"
                return 0
              fi
              echo "waiting for $name $version on index ($i/40)"
              sleep 15
            done
            echo "timed out waiting for $name $version on the sparse index"
            return 1
          }

          publish_if_needed() {
            local pkg="$1" version="$2"
            if crate_exists "$pkg" "$version"; then
              echo "$pkg $version already on crates.io, skipping publish"
              return 0
            fi
            echo "Publishing $pkg $version"
            cargo publish -p "$pkg" --locked
            wait_for_index "$pkg" "$version"
          }

          # rosy-compiler depends on rosy-lib; rosy-cli depends on rosy-compiler.
          # Publish in that order and wait for the sparse index between crates so
          # cargo publish --locked can resolve the just-published dependency.
          publish_if_needed rosy-lib "$LIB_VERSION"
          publish_if_needed rosy-compiler "$COMPILER_VERSION"
          publish_if_needed rosy-cli "$CLI_VERSION"

  build:
    needs: check-version
    if: needs.check-version.outputs.tag_new == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rosy-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: rosy-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: rosy-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: rosy-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p rosy-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rosy dist/${{ matrix.artifact }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rosy.exe" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.tag_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
