name: Publish rosy-cli

on:
  push:
    branches: [master]
    paths:
      - 'rosy-cli/Cargo.toml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      compiler_version: ${{ steps.version.outputs.compiler_version }}
      crate_new: ${{ steps.crate.outputs.is_new }}
      tag_new: ${{ steps.tag.outputs.is_new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' rosy-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMPILER_VERSION=$(grep 'rosy-compiler' rosy-cli/Cargo.toml | grep -o 'version = "[^"]*"' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "compiler_version=$COMPILER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check crates.io
        id: crate
        run: |
          URL="https://crates.io/api/v1/crates/rosy-cli/${{ steps.version.outputs.version }}"
          if curl -fsS -o /dev/null -A "rosy-ci (github.com/rosy-team/rosy)" "$URL"; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "rosy-cli ${{ steps.version.outputs.version }} already on crates.io"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if git tag exists
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  publish-crate:
    needs: check-version
    if: needs.check-version.outputs.crate_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for rosy-compiler on crates.io
        run: |
          URL="https://crates.io/api/v1/crates/rosy-compiler/${{ needs.check-version.outputs.compiler_version }}"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null -A "rosy-ci (github.com/rosy-team/rosy)" "$URL"; then
              echo "rosy-compiler ${{ needs.check-version.outputs.compiler_version }} is on crates.io"
              exit 0
            fi
            echo "waiting for rosy-compiler ${{ needs.check-version.outputs.compiler_version }} ($i/20)"
            sleep 30
          done
          echo "timed out waiting for rosy-compiler ${{ needs.check-version.outputs.compiler_version }}"
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish -p rosy-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    needs: check-version
    if: needs.check-version.outputs.tag_new == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rosy-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: rosy-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: rosy-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: rosy-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p rosy-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rosy dist/${{ matrix.artifact }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rosy.exe" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.tag_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
