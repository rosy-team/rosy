name: Publish rosy-compiler

on:
  push:
    branches: [master]
    paths:
      - 'rosy-compiler/Cargo.toml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' rosy-compiler/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          LIB_VERSION=$(grep 'rosy-lib' rosy-compiler/Cargo.toml | grep -o 'version = "[^"]*"' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "lib_version=$LIB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already on crates.io
        id: check
        run: |
          URL="https://crates.io/api/v1/crates/rosy-compiler/${{ steps.version.outputs.version }}"
          if curl -fsS -o /dev/null -A "rosy-ci (github.com/rosy-team/rosy)" "$URL"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "rosy-compiler ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for rosy-lib on crates.io
        if: steps.check.outputs.exists != 'true'
        run: |
          URL="https://crates.io/api/v1/crates/rosy-lib/${{ steps.version.outputs.lib_version }}"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null -A "rosy-ci (github.com/rosy-team/rosy)" "$URL"; then
              echo "rosy-lib ${{ steps.version.outputs.lib_version }} is on crates.io"
              exit 0
            fi
            echo "waiting for rosy-lib ${{ steps.version.outputs.lib_version }} ($i/20)"
            sleep 30
          done
          echo "timed out waiting for rosy-lib ${{ steps.version.outputs.lib_version }}"
          exit 1

      - name: Install Rust toolchain
        if: steps.check.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        run: cargo publish -p rosy-compiler --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
