name: Publish rosy-lib

on:
  push:
    branches: [master]
    paths:
      - 'rosy-lib/Cargo.toml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' rosy-lib/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already on crates.io
        id: check
        run: |
          URL="https://crates.io/api/v1/crates/rosy-lib/${{ steps.version.outputs.version }}"
          if curl -fsS -o /dev/null -A "rosy-ci (github.com/rosy-team/rosy)" "$URL"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "rosy-lib ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        run: cargo publish -p rosy-lib --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
