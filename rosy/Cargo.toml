[package]
name = "rosy"
version = "1.9.0"
edition = "2024"

[lib]
name = "rosy"
path = "src/lib.rs"

[[bin]]
name = "rosy"
path = "src/main.rs"

[features]
nightly-simd = ["rosy_lib/nightly-simd"]

[dependencies]
anyhow.workspace = true
pest.workspace = true
pest_derive.workspace = true
clap = { version = "4.5", features = ["derive"] }
semver = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
flate2 = "1"
tar = "0.4"
rosy_lib = { path = "../rosy-lib" }

# LSP server dependencies
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
